<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website fit phone screens correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpeedWagon Motors </title>

    <!-- Computer styling -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- Phone styling -->
    <link
        rel="stylesheet"
        href="CSS/mobile.css"
        media="screen and (max-width: 600px)"
    >

    <!-- JavaScript -->
    <script src="JS/script.js" defer></script>
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar">

        <a class="shop-name" href="#home">
            SpeedWagon Motors
        </a>

        <!-- Only visible on phones -->
        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="nav-menu"
        >
            ☰
        </button>

        <!-- Navigation links -->
        <div class="nav-links" id="nav-menu">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About Us</a>
            <a href="#contact">Contact</a>
        </div>

    </nav>

    <!-- Main website content -->
    <main class="content">

        <!-- Content comes from HTML Sections/home.html -->
        <section id="home" class="hero"></section>

        <!-- Content comes from HTML Sections/services.html -->
        <section id="services"></section>

        <!-- Content comes from HTML Sections/about.html -->
        <section id="about"></section>

        <!-- Content comes from HTML Sections/contact.html -->
        <section id="contact"></section>

    </main>

</body>

</html>
