<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">

    <!-- Makes the website fit phone screens correctly -->
    <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0">

    <title>REDLIGHT</title>

    <link rel="icon" type="image/png" href="/images/redlight-favicon.png">

    <!-- Computer styling -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/footer.css">
    
    <!-- Phone styling -->
    <link
        rel="stylesheet"
        href="CSS/mobile.css"
        media="screen and (max-width: 600px)"

    >
  <!--Start file linking for CSS files-->
    <link
    rel="stylesheet"
    href="CSS/about.css"
    >
    
    
    <!-- JavaScript -->
    <script src="JS/script.js" defer></script>
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar">

        <!--Saving this for later
        <a class="shop-name" href="#home">
            REDLIGHT
        </a>
        -->

        <a class="logo" href="#home">
    <img src="images/RedLight.png" alt="Redlight logo">
        </a>

        <!-- Only visible on phones -->
        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="nav-menu"
        >
            ☰
        </button>

        <!-- Navigation links -->
        <div class="nav-links" id="nav-menu">
            <a href="#home">Home</a>
            <a href="#about">About Us</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>

    </nav>

    <!-- Main website content -->
    <main class="content">

        <!-- Content comes from HTML Sections/home.html -->
        <section id="home" class="hero"></section>

        <!-- Content comes from HTML Sections/about.html -->
        <section id="about"></section>

        <!-- Content comes from HTML Sections/services.html -->
        <section id="services"></section>

        <!-- Content comes from HTML Sections/contact.html -->
        <section id="contact"></section>

        <!--footer section connectio-->
        <div id="footer"></div>

    </main>

    <!--TekMetric booking script-->
       
       
       <script>
    window.onload = function() {
    const script = document.createElement('script');
    script.src =
      'https://booking.tekmetric.com/iframe/modal.js?time=' + new Date().getTime();
    script.defer = true;
    document.body.appendChild(script);

    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href =
      'https://booking.tekmetric.com/iframe/modal.css?time=' + new Date().getTime();
    document.head.appendChild(link);
     };
    </script>

</body>

</html>
